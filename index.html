<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaxsiyat testi — 16 tur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EF;
    --bg2:#F5ECF7;
    --surface:#FFFFFF;
    --ink:#241F2E;
    --muted:#8C8494;
    --line:rgba(36,31,46,0.11);
    --violet:#7C5CFC;
    --violet-soft:#EFE9FF;
    --teal:#18A57F;
    --teal-soft:#E2F6EE;
    --blue:#3E7CFF;
    --blue-soft:#E7EEFF;
    --amber:#F07C3B;
    --amber-soft:#FDEBDD;
    --danger:#DA4A56;
    --accent:var(--violet);
    --accent-soft:var(--violet-soft);
    --radius:16px;
    --radius-sm:10px;
  }
  [data-theme="dark"]{
    --bg:#1D1822;
    --bg2:#241C2B;
    --surface:#2A2231;
    --ink:#F3ECE4;
    --muted:#A79EB0;
    --line:rgba(243,236,228,0.12);
    --violet:#A98CFF;
    --violet-soft:#372C55;
    --teal:#3FD3A6;
    --teal-soft:#1E3A34;
    --blue:#7FA3FF;
    --blue-soft:#22304F;
    --amber:#FFA363;
    --amber-soft:#4A3220;
    --danger:#FF8790;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg, var(--bg), var(--bg2) 340px, var(--bg) 900px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    transition:background .3s ease, color .3s ease;
    position:relative;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; }
  a{ color:inherit; }
  button{ font-family:'Inter',sans-serif; cursor:pointer; }
  ::selection{ background:var(--violet-soft); }

  .blob{ position:fixed; border-radius:50%; filter:blur(70px); opacity:.35; z-index:-1; pointer-events:none; }
  .blob-a{ width:420px; height:420px; top:-120px; right:-100px; background:var(--violet); }
  .blob-b{ width:360px; height:360px; top:280px; left:-140px; background:var(--amber); opacity:.25; }
  .blob-c{ width:300px; height:300px; bottom:-80px; right:10%; background:var(--teal); opacity:.22; }

  .shell{ max-width:640px; margin:0 auto; padding:0 24px 90px; position:relative; }
  .wide{ max-width:860px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    max-width:860px; margin:0 auto; padding:26px 24px 0;
  }
  .brand{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; }
  .brand span{ color:var(--violet); font-style:italic; }
  .top-actions{ display:flex; align-items:center; gap:14px; font-size:14px; color:var(--muted); }
  .top-actions button.link{ background:none;border:none;color:var(--muted);font-size:14px;padding:0; }
  .top-actions button.link:hover{ color:var(--ink); }
  .theme-toggle{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface); display:flex;align-items:center;justify-content:center;
    font-size:15px; box-shadow:0 2px 8px rgba(0,0,0,0.04);
  }
  .theme-toggle:hover{ transform:scale(1.06); }

  .eyebrow{
    display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--accent);
    background:var(--accent-soft); border-radius:100px; padding:6px 14px; margin-bottom:18px; font-weight:600;
  }

  .hero{ padding:52px 0 34px; }
  .hero > *{ animation:fadeUp .55s ease both; }
  .hero > *:nth-child(1){ animation-delay:.02s; }
  .hero > *:nth-child(2){ animation-delay:.08s; }
  .hero > *:nth-child(3){ animation-delay:.14s; }
  .hero > *:nth-child(4){ animation-delay:.2s; }
  .hero > *:nth-child(5){ animation-delay:.26s; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
  .hero h1{ font-size:44px; line-height:1.1; margin:0 0 16px; max-width:10em;}
  .hero p.lead{ font-size:17px; line-height:1.6; color:var(--muted); max-width:34em; margin:0 0 26px;}

  .stats-row{ display:flex; flex-wrap:wrap; gap:9px; margin-bottom:28px; }
  .stats-row span{
    font-size:13px; color:var(--ink); border:1px solid var(--line); border-radius:100px;
    padding:7px 14px; background:var(--surface); font-weight:500;
  }
  .stats-row span b{ color:var(--accent); }

  .marquee{ overflow:hidden; padding:6px 0 4px; margin-bottom:8px;
    mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
  .marquee-track{ display:flex; gap:10px; width:max-content; animation:scrollX 30s linear infinite; }
  .marquee:hover .marquee-track{ animation-play-state:paused; }
  .type-chip{
    font-size:13px; font-weight:600; border-radius:100px; padding:8px 15px; white-space:nowrap;
    border:1px solid transparent;
  }
  @keyframes scrollX{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

  .modules{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:6px; }
  .module{
    position:relative; padding:18px 14px; border-radius:var(--radius);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .module:hover{ transform:translateY(-4px); box-shadow:0 12px 26px rgba(0,0,0,0.08); }
  .module .pair{ font-family:'Fraunces',serif; font-size:24px; font-weight:700; }
  .module .pair em{ font-style:normal; opacity:.55; }
  .module .label{ font-size:11.5px; margin-top:6px; line-height:1.4; opacity:.75; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:14px 26px; border-radius:100px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:15px; font-weight:600;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,0.08); }
  .btn:active{ transform:translateY(0) scale(.98); }
  .btn.secondary{ background:transparent; }
  .btn.violet{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 8px 22px rgba(124,92,252,0.28);}
  .btn.block{ width:100%; }
  .btn[disabled]{ opacity:.4; pointer-events:none; }

  .field{ margin-bottom:20px; }
  .field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:7px; font-weight:500; }
  .field input{
    width:100%; padding:13px 15px; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--bg); color:var(--ink); font-size:16px; font-family:'Inter',sans-serif;
    outline:none; transition:border-color .15s ease;
  }
  .field input:focus{ border-color:var(--accent); }
  .field-hint{ font-size:12.5px; color:var(--muted); margin-top:7px; line-height:1.5; }
  .form-error{ color:var(--danger); font-size:13.5px; margin:-6px 0 18px; min-height:1em; }
  .form-switch{ font-size:14px; color:var(--muted); margin-top:22px; }
  .form-switch button{ background:none; border:none; color:var(--accent); font-size:14px; padding:0; font-weight:600; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:32px 28px;
    box-shadow:0 16px 40px rgba(36,31,46,0.06); }

  .progress-dots{ display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap; }
  .progress-dots span{ height:5px; flex:1; min-width:8px; border-radius:4px; background:var(--line); }
  .progress-dots span.done{ background:var(--accent); }
  .progress-count{ font-size:13px; color:var(--muted); margin-bottom:34px; }
  .question h2{ font-size:25px; line-height:1.4; margin:0 0 28px; font-weight:600; }
  .likert{ display:flex; flex-direction:column; gap:9px; }
  .likert button{
    display:flex; align-items:center; gap:14px;
    width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-sm);
    padding:15px 16px; font-size:15px; color:var(--ink); font-family:'Inter',sans-serif;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .likert button .dot{ width:18px;height:18px;border-radius:50%; border:1.5px solid var(--line); flex-shrink:0; }
  .likert button:hover{ border-color:var(--accent); }
  .likert button.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .likert button.selected .dot{ background:var(--accent); border-color:var(--accent); }
  .test-nav{ display:flex; justify-content:space-between; margin-top:30px; }

  .result-card{
    text-align:center; padding:48px 28px; border-radius:24px; position:relative; overflow:hidden;
    animation:fadeUp .5s ease both;
  }
  .result-card .confetti{ position:absolute; border-radius:50%; opacity:.5; }
  .eyebrow-light{ font-size:13px; font-weight:700; letter-spacing:0.04em; opacity:.8; margin-bottom:8px; }
  .result-letters{ font-family:'Fraunces',serif; font-size:78px; font-weight:900; line-height:1; position:relative; }
  .result-title{ font-size:22px; margin-top:12px; font-weight:600; position:relative; }
  .result-desc{ font-size:15.5px; line-height:1.75; max-width:38em; margin:18px auto 0; opacity:.9; position:relative; }
  .trait-bars{ margin-top:38px; display:flex; flex-direction:column; gap:16px; }
  .trait-bar-row{ display:grid; grid-template-columns:1.1fr 3fr 1.1fr; align-items:center; gap:10px; font-size:13px; color:var(--muted); font-weight:600; }
  .trait-track{ height:8px; background:var(--line); border-radius:6px; overflow:hidden; position:relative; }
  .trait-fill{ position:absolute; top:0; bottom:0; left:0; border-radius:6px; }
  .result-actions{ display:flex; gap:10px; margin-top:36px; flex-wrap:wrap; justify-content:center; }

  .history-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 6px; border-bottom:1px solid var(--line); font-size:14.5px;
  }
  .history-item .type{ font-family:'Fraunces',serif; font-weight:700; }
  .history-item .date{ color:var(--muted); font-size:13px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); padding:12px 22px; border-radius:100px;
    font-size:14px; opacity:0; transition:all .25s ease; pointer-events:none; z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .section-title{ font-size:14px; color:var(--muted); margin:44px 0 18px; font-weight:600; }
  .empty{ color:var(--muted); font-size:14.5px; padding:20px 0; }

  footer{
    max-width:860px; margin:60px auto 0; padding:24px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--muted); text-align:center;
  }
  footer a{ color:var(--accent); text-decoration:none; font-weight:600; }
  footer a:hover{ text-decoration:underline; }

  @media (max-width:600px){
    .hero h1{ font-size:33px; }
    .modules{ grid-template-columns:repeat(2,1fr); }
    .result-letters{ font-size:56px; }
    .topbar{ padding:20px 20px 0; }
    .blob{ opacity:.2; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  .fade-in{ animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
</style>
</head>

<script>
/* Bu fayl backend bilan ishlaydi: barcha ma'lumotlar /api/... orqali serverga
   yuboriladi. Parollar va Telegram bot tokeni faqat serverda saqlanadi —
   brauzer tomonida hech qanday maxfiy ma'lumot yo'q. */

const API = "/api";

async function api(path, options={}){
  const res = await fetch(API+path, {
    method: options.method || "GET",
    headers: {"Content-Type":"application/json"},
    credentials: "same-origin",
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "Xatolik yuz berdi.");
  return data;
}

  {axis:"JP", letter:"J", text:"Tartibsizlik va noaniqlik meni bezovta qiladi."},

const LIKERT = [
  {v:1, t:"Mutlaqo rozi emasman"},
  {v:2, t:"Ko'proq rozi emasman"},
  {v:3, t:"Farqi yo'q"},
  {v:4, t:"Ko'proq roziman"},
  {v:5, t:"Mutlaqo roziman"}

const TYPES = {
  INTJ:{title:"Arxitektor-strateg", desc:"Uzoq muddatli rejalar tuzib, tizimni yaxlit ko'ra oladi; mustaqil ishlashni va aniq maqsadlarni yoqtiradi. Muammoni yechishda o'z yo'lini tanlaydi, ortiqcha nazoratni yoqtirmaydi. Kuchli tomoni — chuqur tahlil va uzoqni ko'ra bilish; rivojlanishi kerak bo'lgan joyi — his-tuyg'ularni ham inobatga olish."},
  INTP:{title:"Kashfiyotchi mutafakkir", desc:"G'oyalarni chuqur tahlil qiladi, savol berishdan charchamaydi; nazariy tizimlarni qurish uni qiziqtiradi. Murakkab masalalarni tushunishga vaqt sarflashdan zavq oladi, tayyor javobga darrov ishonmaydi. Kuchli tomoni — mantiqiy fikrlash; ba'zan amaliy ishga o'tishni kechiktirib yuborishi mumkin."},
  ENTJ:{title:"Tashkilotchi yetakchi", desc:"Qarorlarni tez qabul qiladi, jamoani natijaga yo'naltiradi; samaradorlik va o'sishga intiladi. Katta maqsad qo'yib, unga erishish yo'lini tuzishni yaxshi ko'radi. Kuchli tomoni — qat'iyat va tashkilotchilik; rivojlanishi kerak bo'lgan joyi — boshqalarning fikriga sabr bilan quloq solish."},
  ENTP:{title:"G'oyalar generatori", desc:"Munozarada o'sadi, muqobil yechimlarni topishni yaxshi ko'radi; o'zgarishdan qo'rqmaydi. Yangi loyihani boshlashga ishtiyoqi baland, lekin uni oxirigacha yetkazish ustida ishlashi kerak. Kuchli tomoni — ijodiy fikrlash va moslashuvchanlik."},
  INFJ:{title:"Ilhomchi maslahatchi", desc:"Chuqur ma'no va maqsadni izlaydi, boshqalarning ichki dunyosini yaxshi tushunadi. Kam so'z bilan ko'p narsani anglatadigan, atrofdagilarga g'amxo'r munosabatda bo'ladi. Kuchli tomoni — sezgirlik va samimiylik; o'zini his-tuyg'ular bilan ortiqcha band qilib qo'yishi mumkin."},
  INFP:{title:"Orzuparast idealist", desc:"Qadriyatlarga sodiq, ijodiy va samimiy; o'z yo'lini o'zi tanlashni afzal ko'radi. Ichki dunyosi boy, narsalarni chuqur his qiladi va ma'noli ishga intiladi. Kuchli tomoni — sadoqat va ijodkorlik; qat'iy qoidalar ostida o'zini erkin his qilmasligi mumkin."},
  ENFJ:{title:"Ilhomlantiruvchi rahbar", desc:"Odamlarni birlashtirib, ularning eng yaxshi tomonlarini ochishga yordam beradi. Boshqalarning rivojlanishidan chin dildan quvonadi, jamoada ijobiy muhit yaratadi. Kuchli tomoni — ilhomlantirish qobiliyati; o'zining ehtiyojlarini orqa planga surib qo'yishi mumkin."},
  ENFP:{title:"Cheksiz g'ayratli", desc:"Yangi imkoniyatlarga ochiq, odamlar bilan tez til topishadi; ilhom bilan harakat qiladi. Hayotga qiziqish bilan qaraydi, ko'p narsani sinab ko'rishni yoqtiradi. Kuchli tomoni — energiya va ijodkorlik; diqqatni bir joyga jamlash qiyinroq kechishi mumkin."},
  ISTJ:{title:"Ishonchli tashkilotchi", desc:"Vazifaga mas'uliyat bilan yondashadi, tartib va aniqlikni qadrlaydi; so'zida turadi. Ishni bosqichma-bosqich, puxta bajarishni yaxshi ko'radi, va'daga sodiq. Kuchli tomoni — barqarorlik va ishonchlilik; kutilmagan o'zgarishlarga moslashish biroz vaqt oladi."},
  ISFJ:{title:"Sodiq homiy", desc:"Yaqinlariga g'amxo'rlik qiladi, amaliy yordamni so'zdan ko'ra ustun qo'yadi. Boshqalarning ehtiyojini sezgirlik bilan payqaydi va yordam berishdan zavq oladi. Kuchli tomoni — sadoqat va mehribonlik; o'z ehtiyojlarini aytishdan tortinishi mumkin."},
  ESTJ:{title:"Tartib ustasi", desc:"Jarayonlarni aniq boshqaradi, qoidalar va natijaga alohida e'tibor beradi. Ishni tezda tashkil qilib, jamoani belgilangan maqsad sari yetaklaydi. Kuchli tomoni — intizom va mas'uliyat; moslashuvchanlikni oshirish foyda beradi."},
  ESFJ:{title:"Hamjamiyat quruvchisi", desc:"Atrofdagilarning ehtiyojini sezadi, jamoa ruhini saqlashga harakat qiladi. Odamlar orasida uyg'unlik yaratishni, birgalikda ishlashni yaxshi ko'radi. Kuchli tomoni — mehribonlik va tashkilotchilik; boshqalar nima deydi degan tashvishni kamaytirish foydali."},
  ISTP:{title:"Amaliy hunarmand", desc:"Qo'l bilan ishlashni, muammoni sinov orqali yechishni yaxshi ko'radi; mustaqil harakat qiladi. Vaziyatga tez moslashadi, nazariyadan ko'ra amaliy natijaga qiziqadi. Kuchli tomoni — sovuqqonlik va aniqlik; his-tuyg'ularini ifodalash unga qiyinroq kelishi mumkin."},
  ISFP:{title:"Nozik ijodkor", desc:"Go'zallikka sezgir, o'z his-tuyg'ulariga sodiq; ohista, ammo chuqur his qiladi. Erkinlikni qadrlaydi, o'z did va qarashlarini tinch, bosim o'tkazmasdan namoyon qiladi. Kuchli tomoni — did va samimiylik; qat'iy tanqidga nisbatan sezgirroq bo'lishi mumkin."},
  ESTP:{title:"Jasur amaliyotchi", desc:"Harakatda qaror qabul qiladi, xavf-xatardan qochmaydi; hayotni his qilib yashaydi. Vaziyatga tez moslashadi, muammoni darhol, amalda hal qilishni yoqtiradi. Kuchli tomoni — jasorat va tezkorlik; uzoq muddatli rejalashtirish uni unchalik qiziqtirmasligi mumkin."},
  ESFP:{title:"Hayot bag'ishlovchi", desc:"Kayfiyatni ko'taradi, hoziru shu lahzadan zavq oladi; odamlar bilan bo'lishni yaxshi ko'radi. Atrofga quvonch ulashadi, yangi tajribalarga ochiq. Kuchli tomoni — samimiylik va energiya; jiddiy vazifalarda intizomni saqlash ustida ishlashi foydali."}
};

/* Har bir tur 4 ta "oilaga" bo'linadi, har biriga o'z rangi biriktiriladi —
   natija ekrani va sahifa shu rangda "jonlanadi". */
function groupOf(type){
  const n = type[1], f2 = type[2], f3 = type[3];
  if(n === "N" && f2 === "T") return "violet";
  if(n === "N" && f2 === "F") return "teal";
  if(n === "S" && f3 === "J") return "blue";
  return "amber";
}

let state = {
  view: "loading",
  user: null,
  theme: "light",
  answers: {},
  qIndex: 0,
  authMode: "login",
  authError: "",
  lastResult: null
};

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 2600);
}

function applyTheme(){ document.body.setAttribute("data-theme", state.theme === "dark" ? "dark" : "light"); }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const app = document.getElementById("app");
const topActions = document.getElementById("topActions");

function renderTopActions(){
  if(state.user){
    topActions.innerHTML = `
      <span>${escapeHtml(state.user.username)}</span>
      <button class="link" id="btnLogout">Chiqish</button>
      <button class="theme-toggle" id="btnTheme">${state.theme==="dark"?"☾":"☀"}</button>
    `;
    document.getElementById("btnLogout").onclick = logout;
  }else{
    topActions.innerHTML = `<button class="theme-toggle" id="btnTheme">${state.theme==="dark"?"☾":"☀"}</button>`;
  }
  document.getElementById("btnTheme").onclick = toggleTheme;
}

async function toggleTheme(){
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme();
  renderTopActions();
  if(state.user){
    try{ await api("/theme", {method:"POST", body:{theme:state.theme}}); }catch(e){}
  }
}

function render(){
  renderTopActions();
  if(state.view === "auth") return renderAuth();
  if(state.view === "home") return renderHome();
  if(state.view === "test") return renderTest();
  if(state.view === "result") return renderResult(state.lastResult);
  app.innerHTML = "";
}

function renderAuth(){
  const isLogin = state.authMode === "login";
  app.innerHTML = `
    <div class="hero fade-in">
      <div class="eyebrow">✦ ${isLogin ? "Xush kelibsiz" : "16 turdan qaysi biri sizsiz?"}</div>
      <h1>${isLogin ? "Qaytib kelganingizdan xursandmiz." : "O'zingizni yaqindan tanish vaqti keldi."}</h1>
      <p class="lead">O'zbek tilida tayyorlangan qisqa test orqali 16 shaxsiyat turidan qaysi biriga yaqinligingizni bilib oling — har bir tur o'z rangi va xarakteriga ega.</p>
      <div class="stats-row">
        <span><b>24</b> savol</span>
        <span><b>~3</b> daqiqa</span>
        <span><b>16</b> shaxsiyat turi</span>
        <span><b>100%</b> bepul</span>
      </div>
      <div class="marquee">
        <div class="marquee-track">
          ${Object.keys(TYPES).concat(Object.keys(TYPES)).map(t=>{
            const g = groupOf(t);
            return `<span class="type-chip" style="background:var(--${g}-soft); color:var(--${g});">${t} · ${TYPES[t].title}</span>`;
          }).join("")}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="field">
        <label>Foydalanuvchi nomi</label>
        <input id="inpUsername" type="text" autocomplete="username" placeholder="masalan: dilnoza_k">
        <div class="field-hint">Email yoki Gmail manzilingizni emas, oddiy taxallus kiriting (masalan: dilnoza_k). Bu nom boshqalarga ham ko'rinishi mumkin.</div>
      </div>
      <div class="field">
        <label>Parol</label>
        <input id="inpPassword" type="password" autocomplete="${isLogin?"current-password":"new-password"}" placeholder="••••••">
      </div>
      <div class="form-error">${state.authError||""}</div>
      <button class="btn violet block" id="btnAuthSubmit">${isLogin ? "Kirish" : "Ro'yxatdan o'tish"}</button>
      <div class="form-switch">
        ${isLogin ? "Akkountingiz yo'qmi?" : "Akkountingiz bormi?"}
        <button id="btnAuthSwitch">${isLogin ? "Ro'yxatdan o'tish" : "Kirish"}</button>
      </div>
    </div>
  `;
  document.getElementById("btnAuthSwitch").onclick = ()=>{
    state.authMode = isLogin ? "register" : "login";
    state.authError = "";
    render();
  };
  document.getElementById("btnAuthSubmit").onclick = handleAuthSubmit;
  document.getElementById("inpPassword").addEventListener("keydown", e=>{ if(e.key==="Enter") handleAuthSubmit(); });
}

async function handleAuthSubmit(){
  const username = document.getElementById("inpUsername").value.trim();
  const password = document.getElementById("inpPassword").value;
  if(!username || !password){
    state.authError = "Ikkala maydonni ham to'ldiring.";
    return render();
  }
  const btn = document.getElementById("btnAuthSubmit");
  btn.disabled = true;
  try{
    const endpoint = state.authMode === "register" ? "/register" : "/login";
    const { user } = await api(endpoint, {method:"POST", body:{username, password}});
    state.user = user;
    state.theme = user.theme || state.theme;
    applyTheme();
    state.authError = "";
    toast(`Xush kelibsiz, ${user.username}!`);
    state.view = "home";
    render();
  }catch(e){
    state.authError = e.message;
    btn.disabled = false;
    render();
  }
}

async function logout(){
  try{ await api("/logout", {method:"POST"}); }catch(e){}
  state.user = null;
  state.view = "auth";
  state.authMode = "login";
  render();
}

function renderHome(){
  const results = state.user.results || [];
  const last = results[results.length-1];
  const axisColors = ["violet","teal","blue","amber"];
  const axisLabels = [["E","I","Diqqat qayerga qaratiladi"],["S","N","Ma'lumot qanday qabul qilinadi"],["T","F","Qaror qanday qabul qilinadi"],["J","P","Hayotga munosabat"]];
  app.innerHTML = `
    <div class="hero fade-in">
      <div class="eyebrow">✦ Boshqaruv paneli</div>
      <h1>Assalomu alaykum, ${escapeHtml(state.user.username)}.</h1>
      <p class="lead">${last ? "Oldingi natijangizni ko'rishingiz yoki testni qaytadan topshirishingiz mumkin." : "Hali test topshirmagansiz — boshlashga tayyormisiz?"}</p>
      <div class="modules">
        ${axisLabels.map((a,i)=>{
          const c = axisColors[i];
          return `<div class="module" style="background:var(--${c}-soft); color:var(--${c});">
            <div class="pair">${a[0]}<em>/</em>${a[1]}</div>
            <div class="label">${a[2]}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
    <button class="btn violet block" id="btnStart">${last ? "Testni qaytadan topshirish" : "Testni boshlash"}</button>

    ${last ? `
      <div class="section-title">So'nggi natija</div>
      <div class="panel" style="text-align:center; padding:26px; background:var(--${groupOf(last.type)}-soft);">
        <div class="serif" style="font-size:34px; color:var(--${groupOf(last.type)}); font-weight:900;">${last.type}</div>
        <div style="margin-top:6px; color:var(--muted); font-size:14px;">${TYPES[last.type].title}</div>
      </div>
    ` : ""}

    <div class="section-title">Tarix</div>
    ${results.length ? results.slice().reverse().map(r=>`
      <div class="history-item">
        <span class="type" style="color:var(--${groupOf(r.type)});">${r.type} — ${TYPES[r.type].title}</span>
        <span class="date">${new Date(r.date).toLocaleDateString("uz-UZ")}</span>
      </div>
    `).join("") : `<div class="empty">Hozircha natijalar yo'q.</div>`}
  `;
  document.getElementById("btnStart").onclick = startTest;
}

function startTest(){
  state.answers = {};
  state.qIndex = 0;
  state.view = "test";
  render();
}

function renderTest(){
  const q = QUESTIONS[state.qIndex];
  const selected = state.answers[state.qIndex];
  app.innerHTML = `
    <div class="fade-in">
      <div class="progress-dots">
        ${QUESTIONS.map((_,i)=>`<span class="${i<=state.qIndex && state.answers[i]!==undefined ? "done":""}"></span>`).join("")}
      </div>
      <div class="progress-count">Savol ${state.qIndex+1} / ${QUESTIONS.length}</div>
      <div class="question">
        <h2>${escapeHtml(q.text)}</h2>
        <div class="likert">
          ${LIKERT.map(l=>`
            <button data-v="${l.v}" class="${selected===l.v?"selected":""}">
              <span class="dot"></span>${l.t}
            </button>
          `).join("")}
        </div>
      </div>
      <div class="test-nav">
        <button class="btn secondary" id="btnBack" ${state.qIndex===0?"disabled":""}>Orqaga</button>
        <button class="btn violet" id="btnNext" ${selected===undefined?"disabled":""}>${state.qIndex===QUESTIONS.length-1?"Yakunlash":"Keyingisi"}</button>
      </div>
    </div>
  `;
  app.querySelectorAll(".likert button").forEach(btn=>{
    btn.onclick = ()=>{ state.answers[state.qIndex] = parseInt(btn.dataset.v,10); render(); };
  });
  document.getElementById("btnBack").onclick = ()=>{ state.qIndex--; render(); };
  document.getElementById("btnNext").onclick = ()=>{
    if(state.qIndex === QUESTIONS.length-1){ finishTest(); }
    else { state.qIndex++; render(); }
  };
}

async function finishTest(){
  const totals = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  QUESTIONS.forEach((q,i)=>{ totals[q.letter] += (state.answers[i]||3); });
  const type =
    (totals.E>=totals.I?"E":"I") +
    (totals.S>=totals.N?"S":"N") +
    (totals.T>=totals.F?"T":"F") +
    (totals.J>=totals.P?"J":"P");

  const traitPairs = [["E","I"],["S","N"],["T","F"],["J","P"]];
  const traitPct = traitPairs.map(([a,b])=>{
    const sum = totals[a]+totals[b];
    return {a,b, pctA: Math.round(totals[a]/sum*100)};
  });

  try{
    const { user } = await api("/results", {method:"POST", body:{type}});
    state.user = user;
  }catch(e){
    toast("Natijani saqlashda xatolik: " + e.message);
  }

  state.lastResult = { type, date: Date.now(), traitPct };
  state.view = "result";
  render();
}

function renderResult(result){
  const info = TYPES[result.type];
  const g = groupOf(result.type);
  app.innerHTML = `
    <div class="result-card fade-in" style="background:var(--${g}-soft);">
      <div class="eyebrow-light" style="color:var(--${g});">SIZNING NATIJANGIZ</div>
      <div class="result-letters" style="color:var(--${g});">${result.type}</div>
      <div class="result-title">${info.title}</div>
      <p class="result-desc">${info.desc}</p>
    </div>
    <div class="trait-bars">
      ${result.traitPct.map(t=>`
        <div class="trait-bar-row">
          <span>${t.a} ${t.pctA}%</span>
          <div class="trait-track"><div class="trait-fill" style="width:${t.pctA}%; background:var(--${g});"></div></div>
          <span style="text-align:right;">${100-t.pctA}% ${t.b}</span>
        </div>
      `).join("")}
    </div>
    <div class="result-actions">
      <button class="btn violet" id="btnCopy">Natijani nusxalash</button>
      <button class="btn secondary" id="btnRetake">Qaytadan topshirish</button>
      <button class="btn secondary" id="btnHome">Bosh sahifa</button>
    </div>
  `;
  document.getElementById("btnCopy").onclick = async ()=>{
    const text = `Mening shaxsiyat turim: ${result.type} — ${info.title}`;
    try{ await navigator.clipboard.writeText(text); toast("Nusxalandi."); }
    catch(e){ toast(text); }
  };
  document.getElementById("btnRetake").onclick = startTest;
  document.getElementById("btnHome").onclick = ()=>{ state.view="home"; render(); };
}

async function init(){
  applyTheme();
  try{
    const { user } = await api("/me");
    state.user = user;
    state.theme = user.theme || state.theme;
    applyTheme();
    state.view = "home";
  }catch(e){
    state.view = "auth";
  }
  render();
}

init();

document.addEventListener("keydown", (e)=>{
  if(state.view !== "test") return;
  if(["1","2","3","4","5"].includes(e.key)){
    state.answers[state.qIndex] = parseInt(e.key,10);
    render();
  }
});
</script>
</body>
</html>
